# Forge toolchain catalog — single source of truth for download URLs.
# Workspaces pin versions in FORGE_ROOT; {version} expands at sync time.

[toolchains.clang]
aliases = ["llvm"]
default_version = "23.1.0"

[toolchains.clang.targets.linux-x86_64]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-{version}/LLVM-{version}-Linux-X64.tar.xz"

[toolchains.clang.targets.linux-aarch64]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-{version}/LLVM-{version}-Linux-ARM64.tar.xz"

[toolchains.clang.targets.darwin-x86_64]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-{version}/LLVM-{version}-macOS-X64.tar.xz"

[toolchains.clang.targets.darwin-aarch64]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-{version}/LLVM-{version}-macOS-ARM64.tar.xz"

[toolchains.gcc]
default_version = "14"

[toolchains.gcc.version_aliases]
"14" = "2025.08"
"13" = "2024.05"
"12" = "2024.02"

[toolchains.gcc.targets.linux-x86_64]
url = "https://toolchains.bootlin.com/downloads/releases/toolchains/x86-64/tarballs/x86-64--glibc--stable-{version}-1.tar.xz"

[toolchains.gcc.targets.linux-aarch64]
url = "https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--glibc--stable-{version}-1.tar.xz"

[toolchains.zig]
default_version = "0.16.0"

[toolchains.zig.targets.linux-x86_64]
url = "https://ziglang.org/download/{version}/zig-x86_64-linux-{version}.tar.xz"

[toolchains.zig.targets.linux-aarch64]
url = "https://ziglang.org/download/{version}/zig-aarch64-linux-{version}.tar.xz"

[toolchains.zig.targets.macos-x86_64]
url = "https://ziglang.org/download/{version}/zig-x86_64-macos-{version}.tar.xz"

[toolchains.zig.targets.macos-aarch64]
url = "https://ziglang.org/download/{version}/zig-aarch64-macos-{version}.tar.xz"

[toolchains.cmake]
default_version = "4.4.3"

[toolchains.cmake.targets.linux-x86_64]
url = "https://github.com/Kitware/CMake/releases/download/v{version}/cmake-{version}-linux-x86_64.tar.gz"

[toolchains.make]
aliases = ["gmake"]
default_version = "4.4.1"

[toolchains.make.targets.linux-x86_64]
url = "https://ftp.gnu.org/gnu/make/make-{version}.tar.gz"

[toolchains.mold]
default_version = "2.42.0"

[toolchains.mold.targets.linux-x86_64]
url = "https://github.com/rui314/mold/releases/download/v{version}/mold-{version}-x86_64-linux.tar.gz"

[toolchains.mold.targets.linux-aarch64]
url = "https://github.com/rui314/mold/releases/download/v{version}/mold-{version}-aarch64-linux.tar.gz"

[toolchains.dmd]
default_version = "2.113.0"

[toolchains.dmd.targets.linux-x86_64]
url = "https://downloads.dlang.org/releases/2026/dmd.{version}.linux.tar.xz"

[toolchains.ldc]
default_version = "1.42.0"

[toolchains.ldc.targets.linux-x86_64]
url = "https://github.com/ldc-developers/ldc/releases/download/v{version}/ldc2-{version}-linux-x86_64.tar.xz"

[toolchains.ldc.targets.linux-aarch64]
url = "https://github.com/ldc-developers/ldc/releases/download/v{version}/ldc2-{version}-linux-aarch64.tar.xz"

[toolchains.rust]
default_version = "1.98.0"

[toolchains.rust.targets.linux-x86_64]
url = "https://static.rust-lang.org/dist/rust-{version}-x86_64-unknown-linux-gnu.tar.gz"

[toolchains.rust.targets.linux-aarch64]
url = "https://static.rust-lang.org/dist/rust-{version}-aarch64-unknown-linux-gnu.tar.gz"

[toolchains.rust.targets.darwin-x86_64]
url = "https://static.rust-lang.org/dist/rust-{version}-x86_64-apple-darwin.tar.gz"

[toolchains.rust.targets.darwin-aarch64]
url = "https://static.rust-lang.org/dist/rust-{version}-aarch64-apple-darwin.tar.gz"

[toolchains.lcov]
default_version = "2.1"

[toolchains.lcov.targets.linux-x86_64]
url = "https://github.com/linux-test-project/lcov/releases/download/v{version}/lcov-{version}.tar.gz"

[toolchains.lcov.targets.linux-aarch64]
url = "https://github.com/linux-test-project/lcov/releases/download/v{version}/lcov-{version}.tar.gz"

[toolchains.lcov.targets.darwin-x86_64]
url = "https://github.com/linux-test-project/lcov/releases/download/v{version}/lcov-{version}.tar.gz"

[toolchains.lcov.targets.darwin-aarch64]
url = "https://github.com/linux-test-project/lcov/releases/download/v{version}/lcov-{version}.tar.gz"
